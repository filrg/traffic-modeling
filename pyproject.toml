[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seren-countfirst"
version = "0.1.0"
description = "Trace-calibrated count-first arrival and job-size generator for LLM fine-tuning workloads"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]
dev = [
    "mypy>=1.17",
    "pyflakes>=3.2",
    "pytest>=8.0",
    "ruff>=0.12",
]

[project.scripts]
seren-pipeline = "seren_countfirst.run_pipeline.__main__:cli"

[tool.setuptools.packages.find]
include = ["seren_countfirst*", "traffic_modeling*"]
exclude = ["seren_countfirst.tests*"]

[tool.pytest.ini_options]
testpaths = ["seren_countfirst/tests"]
markers = [
    "slow: takes more than a few seconds; excluded by `-m 'not slow'`",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".internal-backups",
    "docs",
    "results*",
    "seren_countfirst/tests",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = [
    "tools",
    "traffic_modeling",
    "seren_countfirst/artifacts.py",
    "seren_countfirst/paths.py",
    "seren_countfirst/provenance.py",
    "seren_countfirst/run_pipeline/__init__.py",
    "seren_countfirst/run_pipeline/__main__.py",
    "seren_countfirst/run_pipeline/artifact_tracking.py",
    "seren_countfirst/run_pipeline/candidate_registry.py",
    "seren_countfirst/run_pipeline/config.py",
    "seren_countfirst/run_pipeline/context.py",
    "seren_countfirst/run_pipeline/manifest.py",
    "seren_countfirst/run_pipeline/model_registry.py",
    "seren_countfirst/run_pipeline/planning.py",
    "seren_countfirst/run_pipeline/preflight.py",
    "seren_countfirst/run_pipeline/randomness.py",
    "seren_countfirst/run_pipeline/recipes.py",
    "seren_countfirst/run_pipeline/registry.py",
    "seren_countfirst/run_pipeline/spec.py",
    "seren_countfirst/run_pipeline/state.py",
]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
